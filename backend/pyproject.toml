[project]
name = "civicflow-backend"
version = "0.1.0"
description = "CivicFlow AI - autonomous community operations agent built on Strands Agents SDK"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "strands-agents>=1.55,<2",
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "sqlalchemy>=2.0,<3",
  "pydantic>=2.7,<3",
  "pydantic-settings>=2.3,<3",
  "boto3>=1.34",
  "psycopg[binary]>=3.1,<4",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.6"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
